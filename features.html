/* Slide rail beneath the showcase. Styled as the app's own sub-tab bar —
   frosted strip, pill tabs that lift on hover and compress on press, accent
   fill on the selected one. Hover/active state lives in CSS rather than in
   onMouseEnter handlers so it cannot get stuck after a tap on touch. */
const FeatureNav = ({ activeIndex, onSelect }) => (
  <div role="tablist" aria-label="Showcase sections" style={{
    position: 'relative',
    flexShrink: 0,
    display: 'flex', alignItems: 'center',
    gap: 6,
    padding: '9px 14px',
    background: 'rgba(7,7,16,0.72)',
    borderTop: '1px solid var(--border-subtle)',

    overflowX: 'auto', overflowY: 'hidden',
    scrollbarWidth: 'none',
  }}>
    <div style={{ position:'absolute', top:0, left:0, right:0, height:1, background:'linear-gradient(90deg, transparent, rgba(var(--accent-rgb),0.28), transparent)' }} />
    {FEATURE_SLIDES.map(f => (
      <button
        key={f.label}
        className="mg-tab"
        role="tab"
        aria-selected={activeIndex === f.index}
        onClick={() => onSelect(f.index)}
      >{f.label}</button>

);

/* ── APP ──────────────────────────────────────────────────── */
const App = () => {
  useTweaks(/*EDITMODE-BEGIN*/{"accentColor":"#38bdf8"}/*EDITMODE-END*/);
  const [activeIndex, setActiveIndex] = useState(1);
  const iframeRef = useRef(null);

  // Listen for slide-change messages sent back from showcase.medgryd.com.
  // The showcase should fire: postMessage({ type: 'slideChange', index: N }, '*')
  // We also accept common alternative key names for robustness.
  useEffect(() => {
    const handler = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      const d = e.data;
      // Accept any of these key names for the slide index
      const idx = d.index ?? d.slideIndex ?? d.slide ?? d.currentSlide;
      if (typeof idx !== 'number') return;
      // Map to the nearest FEATURE_SLIDE whose .index is <= the incoming idx
      const match = [...FEATURE_SLIDES].reverse().find(f => f.index <= idx);
      if (match) setActiveIndex(match.index);
    };
    window.addEventListener('message', handler);
    return () => window.removeEventListener('message', handler);
  }, []);

  const goToSlide = (index) => {
    setActiveIndex(index);
    if (iframeRef.current) {
      iframeRef.current.contentWindow.postMessage({ type: 'goTo', index }, '*');
    }
  };

  return (
    <div>
      <Navbar />
      <PageHeader />
      <Showcase activeIndex={activeIndex} onSelect={goToSlide} iframeRef={iframeRef} />
      <ToolGroups />
      <CtaSection />
      <Footer />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
